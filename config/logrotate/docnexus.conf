# logrotate cho DocNexus — cài bằng: sudo scripts/install_logrotate.sh
# Chỉ xoay vòng các tệp ghi ngoài Python (stdout.log, startup.log, log cũ trong data/).
# app.log / error.log / access.log do ứng dụng tự xoay vòng (LOG_MAX_MB, LOG_BACKUPS) — không đưa vào đây
# để tránh hai cơ chế cùng xoay một tệp.
@ROOT@/@LOG_DIR@/stdout.log @ROOT@/@LOG_DIR@/startup.log @ROOT@/data/*.log {
    su @USER@ @GROUP@
    daily
    maxsize 20M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    # tiến trình đang ghi giữ nguyên tệp: chép rồi cắt, không cần khởi động lại
    copytruncate
}
